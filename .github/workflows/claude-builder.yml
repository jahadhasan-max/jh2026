name: Claude builder

# Runs Claude when a build task is handed off:
#   - an issue gets the `claude-build` label (how OpenClaw dispatches work), or
#   - someone with write access mentions @claude on an issue or PR.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  build:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude-build') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Generate with `claude setup-token` and save as a repo secret.
          # To bill an API key instead, swap for: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-build
          # If OpenClaw files issues from a bot account, add it here, e.g. "openclaw-bot[bot]".
          allowed_bots: ""
          # Full shell so Claude can install deps and run tests for whatever stack the task needs.
          # Only users with write access (and allowed_bots) can trigger this workflow.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
            --max-turns 80
